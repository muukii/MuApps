name: Deploy Ad Hoc OTA
run-name: Deploy Ad Hoc OTA (${{ inputs.app || 'all' }}) from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app:
        description: App to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - Verse
          - Journal
          - PhotosOrganizer
          - AmbientLight
          - Färg
          - PolyReader
          - VoiceRecorder

permissions:
  actions: read
  contents: write

# Queue runs that update the shared release. Cancelling a run while --clobber
# replaces an asset can otherwise leave that app without a published asset.
concurrency:
  group: adhoc-ota-run-adhoc-latest
  queue: max

jobs:
  select-apps:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}

    steps:
      - name: Require main branch
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Ad Hoc OTA publishing is restricted to the main branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Select apps
        id: select
        shell: bash
        run: |
          set -euo pipefail

          requested_app="${{ inputs.app || 'all' }}"

          if [ "$requested_app" = "all" ]; then
            selected_apps="$(jq -c '.apps' .github/adhoc-apps.json)"
          else
            selected_apps="$(jq -c --arg requested_app "$requested_app" \
              '[.apps[] | select(.name == $requested_app)]' \
              .github/adhoc-apps.json)"
          fi

          if [ "$selected_apps" = "[]" ]; then
            echo "::error::No Ad Hoc deploy configuration found for ${requested_app}."
            exit 1
          fi

          jq -e '
            type == "array" and
            length > 0 and
            all(.[];
              (.name | type == "string" and length > 0) and
              (.project_path | type == "string" and length > 0) and
              (.scheme | type == "string" and length > 0) and
              (.bundle_identifier | type == "string" and length > 0) and
              (.ipa_name | type == "string" and endswith(".ipa")) and
              (.manifest_name | type == "string" and endswith("-manifest.plist"))
            ) and
            ([.[].name] | length) == ([.[].name] | unique | length) and
            ([.[].scheme] | length) == ([.[].scheme] | unique | length) and
            ([.[].ipa_name, .[].manifest_name] | length) ==
              ([.[].ipa_name, .[].manifest_name] | unique | length)
          ' <<< "$selected_apps" >/dev/null

          echo "Selected apps:"
          jq -r '.[].name' <<< "$selected_apps"

          matrix="$(jq -c '{include: .}' <<< "$selected_apps")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  prepare-release:
    name: Prepare shared Ad Hoc release
    needs: select-apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update shared release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: adhoc-latest
        run: |
          set -euo pipefail

          release_notes="$(mktemp)"
          trap 'rm -f "$release_notes"' EXIT

          cat > "$release_notes" <<EOF
          Ad Hoc OTA assets from the latest successful main branch build of each MuApps app.

          Apps publish independently. An archive or export failure leaves that app's
          previously published assets untouched while successful app jobs update theirs.
          A failed release upload may require rerunning that app's deploy job.

          Install page:
          https://muukii.github.io/MuApps/install.html

          Currently supported apps:
          EOF

          jq -r \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            '.apps[] | "- \(.name): https://github.com/\($repository)/releases/download/\($release_tag)/\(.manifest_name)"' \
            .github/adhoc-apps.json >> "$release_notes"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Ad Hoc Latest" \
              --notes-file "$release_notes"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Ad Hoc Latest" \
              --notes-file "$release_notes"
          fi

  deploy-app:
    name: ${{ matrix.name }}
    needs:
      - select-apps
      - prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-apps.outputs.matrix) }}
    uses: ./.github/workflows/reusable-ios-adhoc-ota.yml
    with:
      distribution-name: ${{ matrix.name }}
      project-path: ${{ matrix.project_path }}
      scheme: ${{ matrix.scheme }}
      bundle-identifier: ${{ matrix.bundle_identifier }}
      ipa-name: ${{ matrix.ipa_name }}
      manifest-name: ${{ matrix.manifest_name }}
      release-tag: adhoc-latest
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_TEAM_KEY_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_TEAM_KEY_CONTENT }}
      ASC_ISSUER_ID: ${{ secrets.ASC_TEAM_ISSUER_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
